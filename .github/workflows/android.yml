name: Android

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publier une release GitHub (tag v + version de package.json)
        type: boolean
        default: false

concurrency:
  # Une release ne doit pas être annulée par un push sur la même branche.
  group: android-${{ github.ref }}${{ inputs.release && '-release' || '' }}
  cancel-in-progress: true

permissions:
  # Écriture uniquement pour publier les releases.
  contents: write

jobs:
  build:
    name: Tests et APK release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRISME_BUILD_NUMBER: ${{ github.run_number }}
      # Release : tag v* poussé, ou lancement manuel avec l'option « release ».
      PRISME_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release == true }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # En tête du job : une clé absente ou mal copiée échoue en quelques secondes.
      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # Diagnostic d'une clé introuvable : un booléen, aucune valeur affichée.
          KEYSTORE_IN_VARS: ${{ vars.ANDROID_KEYSTORE_BASE64 != '' || vars.ANDROID_KEYSTORE_PASSWORD != '' }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          if [ -n "$missing" ]; then
            # Une release signée avec la clé de debug bloquerait les mises à jour signées ensuite.
            if [ "$PRISME_RELEASE" = true ]; then
              if [ "$KEYSTORE_IN_VARS" = true ]; then
                hint="ils sont dans l'onglet Variables : supprime-les et recrée-les dans l'onglet Secrets"
              else
                hint="à créer avec exactement ce nom dans Settings > Secrets and variables > Actions > Repository secrets"
              fi
              echo "::error title=Release non signée::Secret(s) introuvable(s) :$missing ($hint), puis relance ce workflow."
              exit 1
            fi
            echo "::warning title=APK signé avec une clé de debug::Ajoute les secrets ANDROID_KEYSTORE_BASE64 et ANDROID_KEYSTORE_PASSWORD pour signer l'APK release (voir README)."
            exit 0
          fi
          # La clé n'existe que dans le dossier temporaire du runner, jamais dans le dépôt.
          echo "$KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/release.p12"
          if ! entries="$(keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/release.p12" -storepass:env KEYSTORE_PASSWORD)"; then
            printf '%s\n' "$entries" | tail -n 1
            echo "::error title=Clé de signature invalide::ANDROID_KEYSTORE_BASE64 ou ANDROID_KEYSTORE_PASSWORD incorrect (copie incomplète ? espace en trop ?)."
            exit 1
          fi
          # Alias lu dans le fichier : aucun secret à renseigner pour lui, aucune faute de frappe possible.
          alias="$(printf '%s\n' "$entries" | awk -F', ' '/PrivateKeyEntry/ { print $1 }')"
          if [ -z "$alias" ] || [ "$(printf '%s\n' "$alias" | wc -l)" -ne 1 ]; then
            echo "::error title=Clé de signature invalide::Le fichier de ANDROID_KEYSTORE_BASE64 doit contenir exactement une clé privée."
            exit 1
          fi
          {
            echo "PRISME_KEYSTORE_FILE=$RUNNER_TEMP/release.p12"
            echo "PRISME_KEY_ALIAS=$alias"
          } >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Dépendances
        run: npm ci

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests unitaires web
        run: npm test

      - name: Tests e2e (navigateur mobile simulé)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Build web
        env:
          VITE_UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          VITE_PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          VITE_PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          [ -n "$VITE_UNSPLASH_ACCESS_KEY" ] || echo "::warning title=Clé Unsplash absente::Ajoute le secret UNSPLASH_ACCESS_KEY (voir README)."
          [ -n "$VITE_PEXELS_API_KEY" ] || echo "::warning title=Clé Pexels absente::Ajoute le secret PEXELS_API_KEY (voir README)."
          [ -n "$VITE_PIXABAY_API_KEY" ] || echo "::notice title=Source Pixabay indisponible::Facultatif : ajoute le secret PIXABAY_API_KEY pour l'activer (voir README)."
          npm run build

      - name: Synchronisation Capacitor
        run: npx cap sync android

      # Sans clé release, Gradle signe avec la clé de debug du runner : on la conserve d'un build à
      # l'autre pour que chaque APK s'installe par-dessus le précédent (sans désinstaller l'app).
      - name: Clé de debug persistante
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Tests natifs et APK release
        working-directory: android
        env:
          PRISME_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest :app:lintRelease assembleRelease

      - name: Nommer l'APK
        id: apk
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="Prisme-$VERSION.${PRISME_BUILD_NUMBER}"
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/$NAME.apk"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v$VERSION"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Notes de version affichées dans la release et dans l'app (feuille « Mise à jour »).
          NOTES="release-notes/$VERSION.md"
          [ -f "$NOTES" ] || NOTES=""
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: out/*.apk
          if-no-files-found: error

      # Lancement manuel : le tag est créé sur le commit construit.
      - name: Publier la release
        if: env.PRISME_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.apk.outputs.notes }}
          files: out/*.apk
